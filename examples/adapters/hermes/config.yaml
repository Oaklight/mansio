# Hermes config.yaml — mansio integration
#
# MCP skill for tool access + pulse job for periodic polling.

skills:
  mansio:
    type: mcp
    command: mansio-mcp
    args:
      - --url
      - ${MANSIO_URL}
      - --user-id
      - ${MANSIO_USER_ID}
      - --token
      - ${MANSIO_TOKEN}

cron:
  mansio-poll:
    kind: pulse
    every: 300
    prompt: "Check mansio for new messages: use mansio_poll tool"
    skills:
      - mansio
