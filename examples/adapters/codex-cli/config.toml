# Codex CLI configuration with the mansio MCP server.
#
# Place in .codex/config.toml (per-project) or ~/.codex/config.toml (per-user).
# The SessionStart hook lives in .codex/hooks.json and is written by
# `mansio-agent install`. MANSIO_TOKEN stays in the environment; no token
# belongs in this file.

[mcp_servers.mansio]
command = "mansio-mcp"
args = []

[mcp_servers.mansio.env]
MANSIO_URL = "http://localhost:8742"
MANSIO_USER_ID = "codex-mansio-2"
