# Codex CLI configuration with the mansio MCP server and polling hook.
#
# Place in .codex/config.toml (per-project) or ~/.codex/config.toml (per-user).
# Connection settings come from MANSIO_URL, MANSIO_USER_ID and MANSIO_TOKEN;
# no token belongs in this file.

[mcp_servers.mansio]
command = "mansio-mcp"
args = []

# Poll for messages at session start and resume.
[[hooks.SessionStart]]
matcher = "startup|resume"

[[hooks.SessionStart.hooks]]
type = "command"
command = "mansio-agent poll --format codex"
timeout = 15
statusMessage = "Checking mansio messages"
