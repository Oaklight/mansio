[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mansio-client"
dynamic = ["version"]
authors = [{ name = "Peng Ding", email = "oaklight.cn@gmail.com" }]
description = "Lightweight agent SDK for mansio message bus — no third-party dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mansio-core>=0.3.0.dev1,<0.4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/Oaklight/mansio"
Repository = "https://github.com/Oaklight/mansio"
Issues = "https://github.com/Oaklight/mansio/issues"

[project.scripts]
mansio-client = "mansio_client.cli:main"
mansio-mcp = "mansio_client.mcp:main"
mansio-agent = "mansio_client.agent.cli:main"

[project.optional-dependencies]
test = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.setuptools.dynamic]
version = { attr = "mansio_client.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.zerodep]
vendor-dir = "src/mansio_client/_vendor"
