<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mansio Admin</title>
<link rel="stylesheet" href="/assets/admin.css">
<script src="/assets/theme-init.js"></script>
</head>
<body class="auth-pending">
<div class="app-shell" id="appShell">
    <header class="topbar">
        <a class="brand" href="#/overview" aria-label="Mansio admin home">
            <span class="brand-mark" aria-hidden="true">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </span>
            <span class="brand-name">Mansio</span>
        </a>
        <span class="breadcrumb" id="breadcrumb">Overview</span>
        <div class="topbar-search" id="globalSearch"></div>
        <div class="topbar-actions" id="topbarActions"></div>
    </header>
    <nav class="sidebar" id="sidebar" aria-label="Sections"></nav>
    <main class="main-pane" id="mainPane" tabindex="-1"></main>
    <aside class="detail-pane-slot" id="detailPane" aria-label="Detail"></aside>
</div>

<div class="settings-popup hidden" id="settingsPopup">
    <div class="settings-card">
        <div class="field-label">Theme</div>
        <div class="theme-switcher" id="themeSwitcher">
            <button class="btn" type="button" data-theme="light">Light</button>
            <button class="btn" type="button" data-theme="auto">Auto</button>
            <button class="btn" type="button" data-theme="dark">Dark</button>
        </div>
    </div>
</div>

<div class="login-overlay hidden" id="loginOverlay">
    <form class="login-card" id="loginForm">
        <h2>Sign in</h2>
        <p>Admin authentication is required.</p>
        <label class="field">
            <span class="field-label">Password</span>
            <input class="input" id="loginPassword" type="password" autocomplete="current-password">
        </label>
        <div class="login-error" id="loginError" role="alert"></div>
        <button class="btn btn-primary" type="submit" id="loginButton">Sign in</button>
    </form>
</div>

<div class="toast-container" id="toastContainer" aria-live="polite"></div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
