# Repository tooling.  The distributions live in `packages/`:
#   packages/mansio-core/     core (import root `mansio_core`)
#   packages/mansio-web/      server + admin, distribution name `mansio`
#                             (import root `mansio_web`)
#   packages/mansio-client/   client SDK (import root `mansio_client`)
# Install for development:
#   pip install -e packages/mansio-core -e packages/mansio-web -e packages/mansio-client

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["packages/*/src/*/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C901"]
ignore = ["UP007", "E501"]

[tool.ruff.lint.mccabe]
max-complexity = 16

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = [
    "packages/mansio-core/src",
    "packages/mansio-core/tests",
    "packages/mansio-web/src",
    "packages/mansio-web/tests",
    "packages/mansio-client/src",
    "packages/mansio-client/tests",
]
exclude = ["packages/*/src/*/_vendor"]

[tool.ty.rules]
# uuid.uuid7 is Python 3.14+; we handle AttributeError at runtime
unresolved-attribute = "warn"
# Tests intentionally assign to frozen dataclass to verify it raises
invalid-assignment = "warn"
# Lazy/conditional imports (TYPE_CHECKING, deferred admin loading)
unresolved-import = "warn"
# nats-py type stubs are incomplete (e.g. opt_start_time expects datetime but str works at runtime)
invalid-argument-type = "warn"
# ACL enforcement adds parameters to backend overrides
invalid-method-override = "warn"

[tool.complexipy]
paths = ["packages"]
exclude = ["packages/*/src/*/_vendor"]
max-complexity-allowed = 25
