name: Docker

on:
  workflow_call:
    inputs:
      tag:
        description: "Version to build (e.g. 0.1.0)"
        required: true
        type: string
      testpypi:
        description: "Install from Test PyPI instead of PyPI"
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build (e.g. 0.1.0)"
        required: true
        type: string
      testpypi:
        description: "Install from Test PyPI instead of PyPI"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version tag
        id: meta
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version provided via inputs.tag"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Ensure build context has dist/
        run: mkdir -p mansio/dist

      - name: Wait for PyPI availability
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          if [ "${{ inputs.testpypi }}" = "true" ]; then
            PYPI_URL="https://test.pypi.org/pypi/mansio/$VERSION/json"
            LABEL="Test PyPI"
          else
            PYPI_URL="https://pypi.org/pypi/mansio/$VERSION/json"
            LABEL="PyPI"
          fi
          echo "Waiting for mansio==$VERSION on $LABEL..."
          for i in $(seq 1 45); do
            CODE=$(curl -fsS -o /dev/null -w "%{http_code}" "$PYPI_URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "mansio==$VERSION found on $LABEL (attempt $i)"
              exit 0
            fi
            echo "  Attempt $i/45: not yet available (HTTP $CODE), waiting 20s..."
            sleep 20
          done
          echo "::error::mansio==$VERSION not found on $LABEL after 15 minutes"
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          IMAGE="oaklight/mansio"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tags=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build args
        id: build-args
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          ARGS="PACKAGE_VERSION=${VERSION}"
          if [ "${{ inputs.testpypi }}" = "true" ]; then
            ARGS="${ARGS}
          EXTRA_INDEX_URL=https://test.pypi.org/simple/"
          fi
          echo "args<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ARGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ steps.build-args.outputs.args }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
