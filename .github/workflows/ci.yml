name: CI

on:
  push:
    branches: [master, "dev/**"]
  pull_request:
    branches: [master, "dev/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "mansio[dev,test,irc]"
          pip install -e "mansio-client/"

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify shared files are in sync
        run: |
          bash scripts/sync-shared.sh
          if ! git diff --quiet; then
            echo "ERROR: shared files are out of sync"
            echo "Run: bash scripts/sync-shared.sh"
            git diff --stat
            exit 1
          fi
          echo "All shared files in sync ✅"


  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "mansio[dev,test,irc]"
          pip install -e "mansio-client/"

      - name: Run tests
        run: python -m pytest mansio/tests/ -v

  client-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install mansio-client
        run: |
          python -m pip install --upgrade pip
          pip install mansio-client/

      - name: Verify package imports
        run: |
          python -c "from mansio_client import MansioClient, HttpTransport, MansioAPIError, Message, UserPresence, ClaimResult, __version__; print(f'mansio-client {__version__} OK')"

      - name: Verify CLI entry point
        run: mansio-client --version

      - name: Verify package builds cleanly
        run: |
          pip install build
          python -m build mansio-client/
