name: CI

on:
  push:
    branches: [master, "dev/**"]
  pull_request:
    branches: [master, "dev/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "mansio[dev,test,irc]"

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify mansio-client types.py is in sync
        run: |
          echo "Checking mansio-client types.py matches mansio types.py..."
          if ! diff mansio/src/mansio/types.py mansio-client/src/mansio_client/types.py; then
            echo ""
            echo "ERROR: mansio-client types.py has drifted from mansio/types.py"
            echo "Fix: cp mansio/src/mansio/types.py mansio-client/src/mansio_client/types.py"
            exit 1
          fi

      - name: Verify transport method signatures in sync
        run: |
          python3 -c "
          import ast, sys

          def get_methods(path):
              tree = ast.parse(open(path).read())
              methods = {}
              for node in ast.walk(tree):
                  if isinstance(node, ast.ClassDef) and node.name == 'HttpTransport':
                      for item in node.body:
                          if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef)):
                              if not item.name.startswith('_'):
                                  args = [a.arg for a in item.args.args if a.arg != 'self']
                                  methods[item.name] = args
              return methods

          m1 = get_methods('mansio/src/mansio/transport_http.py')
          m2 = get_methods('mansio-client/src/mansio_client/transport.py')

          if m1 != m2:
              print('ERROR: Transport method signatures have drifted')
              only1 = set(m1) - set(m2)
              only2 = set(m2) - set(m1)
              if only1: print(f'  Only in mansio: {only1}')
              if only2: print(f'  Only in mansio-client: {only2}')
              for name in set(m1) & set(m2):
                  if m1[name] != m2[name]:
                      print(f'  {name}: mansio={m1[name]} vs client={m2[name]}')
              sys.exit(1)
          print('Transport signatures in sync ✅')
          "


  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "mansio[dev,test,irc]"

      - name: Run tests
        run: python -m pytest mansio/tests/ -v
