name: CI

on:
  push:
    branches: [master, "dev/**"]
  pull_request:
    branches: [master, "dev/**"]

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check package import boundaries
        run: python scripts/check_import_boundaries.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/mansio-core
          pip install -e "packages/mansio-client[test]"
          pip install -e "packages/mansio-web[dev,test,irc]"

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install core
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/mansio-core[test]"

      - name: Run core tests
        run: python -m pytest packages/mansio-core/tests/ -v

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install core, client and web
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/mansio-core
          pip install -e packages/mansio-client
          pip install -e "packages/mansio-web[test,irc]"

      - name: Run web tests
        run: python -m pytest packages/mansio-web/tests/ -v

  client-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install core and mansio-client only
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/mansio-core
          pip install -e "packages/mansio-client[test]"

      - name: Verify package imports without the server
        run: |
          python -c "from mansio_client import MansioClient, HttpTransport, MansioAPIError, Message, UserPresence, ClaimResult, __version__; print(f'mansio-client {__version__} OK')"
          python -c "import sys; import mansio_client; assert 'mansio_web' not in sys.modules, 'client imported mansio_web'"

      - name: Verify CLI entry points
        run: |
          mansio-client --version
          mansio-mcp --help >/dev/null

      - name: Run client tests
        run: python -m pytest packages/mansio-client/tests/ -v

      - name: Verify packages build cleanly
        run: |
          pip install build
          python -m build packages/mansio-core/
          python -m build packages/mansio-client/
          python -m build packages/mansio-web/
